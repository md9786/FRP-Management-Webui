

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit {{ .Type }} Config: {{ .Name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
<style>
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  @keyframes spin {
    to { --angle: 360deg; }
  }

  body {
    background-color: #080808;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    color: #f1f5f9;
  }

  #bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
  }

  .content-wrapper { position: relative; z-index: 2; }

  /* Common Liquid Glass Style & Animated Border Base */
  .card, .btn-primary, .btn-success, .btn-danger, .btn-warning, .btn-secondary {
    background: rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    border-radius: 1rem;
    position: relative;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    border: none;
    isolation: isolate;
  }

  /* Pseudo-element for border */
  .card::before, 
  .btn-primary::before, .btn-success::before, .btn-danger::before, .btn-warning::before, .btn-secondary::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 2px;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    z-index: -1;
    animation: spin 3s linear infinite;
    pointer-events: none;
  }

  /* Card Colors */
  .card::before { background: conic-gradient(from var(--angle), rgba(255,255,255,0.8), rgba(0,0,0,0.8), rgba(255,255,255,0.8)); }
  .btn-primary::before { background: conic-gradient(from var(--angle), #3b82f6, transparent, #3b82f6); }
  .btn-danger::before { background: conic-gradient(from var(--angle), #ef4444, transparent, #ef4444); }
  .btn-secondary::before { background: conic-gradient(from var(--angle), #9ca3af, transparent, #9ca3af); }

  .btn-primary, .btn-danger, .btn-secondary {
    display: inline-block;
    text-align: center;
    font-weight: 500;
    color: white;
    transition: transform 0.2s;
    cursor: pointer;
  }
  .btn-primary:hover, .btn-danger:hover, .btn-secondary:hover { transform: translateY(-2px); }

  .form-control {
    background-color: rgba(0, 0, 0, 0.3); 
    border: 1px solid rgba(255, 255, 255, 0.25); 
    color: #e2e8f0; 
    backdrop-filter: blur(2px);
    transition: border-color 0.2s ease;
    border-radius: 0.5rem;
    padding: 0.75rem;
  }
  .form-control:focus {
    background-color: rgba(0, 0, 0, 0.5);
    border-color: rgba(255, 255, 255, 0.6); 
    outline: none;
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
  }
  .form-label { color: #94a3b8; display: block; margin-bottom: 0.5rem; font-size: 0.875rem; }
  
  .hidden { display: none; }
</style>
</head>
<body class="text-gray-100 min-h-screen">
  <div id="bg"></div>

  <div class="content-wrapper">
    <div class="container max-w-4xl mx-auto mt-8 p-4">
      <div class="flex justify-between items-center mb-4">
          <h1 class="text-2xl font-semibold text-gray-100">Edit {{ .Type }} Config: {{ .Name }}</h1>
      </div>

      <form id="edit-form" method="post" class="card p-6 shadow-lg">
        <div class="mb-4">
          <label for="name" class="form-label">Config Name (Rename to change file)</label>
          <input type="text" id="name" name="name" value="{{ .Name }}" required class="form-control w-full" />
        </div>

        <!-- Raw Text Editor -->
        <div id="raw-editor" class="mb-4">
          <label for="content" class="form-label">Config Content (TOML)</label>
          <textarea id="content" name="content" rows="15" class="form-control w-full font-mono text-sm">{{ .Content }}</textarea>
        </div>

        <div class="flex justify-between items-center pt-4">
          <div class="space-x-4">
              <button type="submit" class="btn-primary px-4 py-2 text-gray-200">Save Changes</button>
              <a href="/manage-frp#{{ .Type }}s:{{ .Name }}" class="btn-secondary px-4 py-2 text-gray-200">Back</a>
          </div>
          <button type="button" onclick="deleteConfig()" class="btn-danger px-4 py-2 text-white">Delete Config</button>
        </div>
      </form>
    </div>
  </div>
<script>
    // Submit Handler
    document.getElementById('edit-form').addEventListener('submit', function(e) {
        e.preventDefault();
        saveConfig();
    });

    async function saveConfig() {
        const btn = document.querySelector('button[type="submit"]');
        btn.innerText = 'Saving...';
        const formData = new FormData(document.getElementById('edit-form'));
        try {
            const res = await fetch(window.location.href, { method: 'POST', body: formData });
            if (res.ok) {
                 showToast('Saved successfully');
                 setTimeout(() => window.location.href = document.querySelector('a.btn-secondary').href, 1000);
            }
            else showToast('Error saving', 'error');
        } catch(e) { showToast('Network Error', 'error'); }
        btn.innerText = 'Save Changes';
    }

    async function deleteConfig() {
        if(!confirm("Are you sure you want to delete this configuration? This cannot be undone.")) return;
        const name = "{{ .Name }}";
        const type = "{{ .Type }}";
        const url = `/${type}/delete/${name}`;
        try {
            const res = await fetch(url, { method: 'POST' });
            if (res.ok) {
                showToast('Configuration deleted');
                setTimeout(() => window.location.href = '/manage-frp', 1000);
            } else {
                showToast('Failed to delete', 'error');
            }
        } catch(e) { showToast('Network error', 'error'); }
    }

    function showToast(message, type = 'success') {
        const toast = document.createElement('div');
        toast.className = `fixed top-4 right-4 p-4 rounded-lg shadow-lg text-white z-50 transform transition-all duration-300 translate-y-[-100%] opacity-0 ${type === 'success' ? 'bg-green-600' : 'bg-red-600'}`;
        toast.style.backdropFilter = 'blur(10px)';
        toast.innerText = message;
        document.body.appendChild(toast);
        requestAnimationFrame(() => toast.classList.remove('translate-y-[-100%]', 'opacity-0'));
        setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-[-20px]'); setTimeout(() => toast.remove(), 300); }, 3000);
    }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.globe.min.js"></script>
    <script>
        VANTA.GLOBE({
  el: "#bg",
  mouseControls: false,
  touchControls: false,
  gyroControls: false,
  minHeight: 200.00,
  minWidth: 200.00,
  scale: 1.00,
  scaleMobile: 1.00,
  color: 0x697ca0,
  color2: 0xf21d1d,
  size: 1.20,
  backgroundColor: 0x0
})
</script>
</body>
</html>
