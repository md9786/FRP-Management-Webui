
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage EFRP</title>
  <script src="https://cdn.tailwindcss.com"></script>
<style>
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  @keyframes spin {
    to { --angle: 360deg; }
  }

  body {
    background-color: #080808;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    color: #f1f5f9;
  }

  #bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
  }

  .content-wrapper { position: relative; z-index: 2; }

  /* Common Liquid Glass Style & Animated Border Base */
  .card, .btn-primary, .btn-success, .btn-danger, .btn-warning, .btn-secondary {
    background: rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    border-radius: 1rem;
    position: relative;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    border: none;
    isolation: isolate;
  }

  /* Pseudo-element for border */
  .card::before, 
  .btn-primary::before, .btn-success::before, .btn-danger::before, .btn-warning::before, .btn-secondary::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 2px;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    z-index: -1;
    animation: spin 3s linear infinite;
    pointer-events: none;
  }

  /* Card Colors: White/Black Cycle */
  .card::before {
    background: conic-gradient(from var(--angle), rgba(255,255,255,0.8), rgba(0,0,0,0.8), rgba(255,255,255,0.8));
  }

  /* Button Colors */
  .btn-primary::before { background: conic-gradient(from var(--angle), #3b82f6, transparent, #3b82f6); }
  .btn-success::before { background: conic-gradient(from var(--angle), #22c55e, transparent, #22c55e); }
  .btn-danger::before { background: conic-gradient(from var(--angle), #ef4444, transparent, #ef4444); }
  .btn-warning::before { background: conic-gradient(from var(--angle), #f59e0b, transparent, #f59e0b); }
  .btn-secondary::before { background: conic-gradient(from var(--angle), #9ca3af, transparent, #9ca3af); }

  .btn-primary, .btn-success, .btn-danger, .btn-warning, .btn-secondary {
    display: inline-block;
    text-align: center;
    font-weight: 500;
    color: white;
    transition: transform 0.2s;
    cursor: pointer;
  }
  .btn-primary:hover, .btn-success:hover, .btn-danger:hover, .btn-warning:hover, .btn-secondary:hover {
    transform: translateY(-2px);
  }

  /* Form Elements - More Defined Borders */
  .log-pre, .form-control { 
    background-color: rgba(0, 0, 0, 0.3); 
    border: 1px solid rgba(255, 255, 255, 0.25); 
    color: #e2e8f0; 
    backdrop-filter: blur(2px);
    border-radius: 0.5rem;
  }
  .log-pre {
    white-space: pre-wrap; 
    word-break: break-word; 
  }
  .form-control:focus {
    background-color: rgba(0, 0, 0, 0.5);
    border-color: rgba(255, 255, 255, 0.6); 
    outline: none;
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
  }

  .log-filter-btn { 
    background-color: rgba(255, 255, 255, 0.05); 
    border: 1px solid rgba(255,255,255,0.25);
    transition: all 0.2s ease; 
  }
  .log-filter-btn:hover { background-color: rgba(255, 255, 255, 0.15); }
  .log-filter-btn.active { 
    background-color: rgba(255, 255, 255, 0.2); 
    font-weight: bold; 
    color: white; 
    border-color: rgba(255, 255, 255, 0.6);
  }
</style>
</head>
<body class="text-gray-100 min-h-screen">
  <div id="bg"></div>

  <div class="content-wrapper">
    <div class="flex">
      {{template "sidebar.html" .}}
      <main class="flex-1 p-8">
        <div class="max-w-4xl mx-auto">
          <h1 class="text-2xl font-semibold text-gray-100 mb-4">Manage EFRP</h1>
          <div class="card p-6 mb-4 shadow-lg">
            <div class="flex space-x-3 mb-3">
              <button onclick="performAction('/efrp/start')" class="btn-success px-4 py-2 text-white font-medium">Start</button>
              <button onclick="performAction('/efrp/stop')" class="btn-danger px-4 py-2 text-white font-medium">Stop</button>
              <a href="/" class="btn-secondary px-4 py-2 text-gray-200 text-center">Back</a>
            </div>
            <h6 class="text-sm font-medium text-gray-400 mt-3">Live Logs</h6>
            <div class="flex items-center space-x-2 my-2">
              <div class="w-32 flex-shrink-0">
                  <select id="log-mode-efrp" onchange="handleLogModeChange('efrp', 'efrp', this.value)" class="form-control px-2 py-1 text-sm bg-gray-800 border-gray-600">
                      <option value="live">Live Stream</option>
                      <option value="10 min ago">Last 10 Min</option>
                      <option value="1 hour ago">Last 1 Hour</option>
                      <option value="24 hours ago">Last 24 Hours</option>
                      <option value="boot">Since Boot</option>
                  </select>
              </div>
              <input type="text" placeholder="Search logs..." oninput="applyFilters('efrp')" id="search-efrp" class="form-control w-full px-2 py-1 text-sm">
              <div class="flex-shrink-0 space-x-1 log-filter-buttons">
                <button onclick="applyFilters('efrp', 'all', this)" class="log-filter-btn active px-2 py-1 text-xs rounded-md">All</button>
                <button onclick="applyFilters('efrp', '[I]', this)" class="log-filter-btn px-2 py-1 text-xs rounded-md">INFO</button>
                <button onclick="applyFilters('efrp', '[W]', this)" class="log-filter-btn px-2 py-1 text-xs rounded-md">WARN</button>
                <button onclick="applyFilters('efrp', '[E]', this)" class="log-filter-btn px-2 py-1 text-xs rounded-md">ERROR</button>
              </div>
            </div>
            <pre id="logs-efrp" class="log-pre p-4 mt-2 text-sm" style="max-height: 400px; overflow-y: auto;">Connecting to log stream...</pre>
          </div>
        </div>
      </main>
    </div>
  </div>
<script>
    let logBuffers = {};
    let currentFilters = {};
    let wsConnections = {};
    const MAX_LOG_LINES = 200;

    // Toast Notification System
    function showToast(message, type = 'success') {
        const toast = document.createElement('div');
        toast.className = `fixed top-4 right-4 p-4 rounded-lg shadow-lg text-white z-50 transform transition-all duration-300 translate-y-[-100%] opacity-0 ${type === 'success' ? 'bg-green-600' : 'bg-red-600'}`;
        toast.style.backdropFilter = 'blur(10px)';
        toast.innerText = message;
        document.body.appendChild(toast);
        
        requestAnimationFrame(() => {
            toast.classList.remove('translate-y-[-100%]', 'opacity-0');
        });

        setTimeout(() => {
            toast.classList.add('opacity-0', 'translate-y-[-20px]');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    async function performAction(url) {
        try {
            const res = await fetch(url);
            if(res.ok) {
                showToast('Action executed successfully');
            } else {
                showToast('Action failed', 'error');
            }
        } catch(e) {
            showToast('Network error', 'error');
        }
    }

    function cleanLogLine(line) {
        if (line.includes('frpc[') && (line.includes(' [I] ') || line.includes(' [W] ') || line.includes(' [E] '))) {
            const systemdTimestampMatch = line.match(/^[A-Za-z]{3}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2}\s+/);
            const systemdTimestamp = systemdTimestampMatch ? systemdTimestampMatch[0] : '';
            const cleanedLine = line.replace(/\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\.\d+\s+\[(I|W|E)\]\s+\[[^\]]+\]\s*/, ' [$1] ');
            return (systemdTimestamp + cleanedLine).replace(/dashingorder\.aeza\.network/g, '');
        }
        return line;
    }

    function applyFilters(serviceName, level = null, btnElement = null) {
        if (level && btnElement) {
            currentFilters[serviceName] = { ...currentFilters[serviceName], level: level === 'all' ? null : level };
            const buttonGroup = btnElement.parentElement;
            buttonGroup.querySelectorAll('.log-filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        const searchTerm = document.getElementById(`search-${serviceName}`).value.toLowerCase();
        const logsElement = document.getElementById(`logs-${serviceName}`);
        const buffer = logBuffers[serviceName] || [];
        const activeLevel = currentFilters[serviceName]?.level;

        const filteredLines = buffer.filter(line => {
            const lineLower = line.toLowerCase();
            const searchMatch = !searchTerm || lineLower.includes(searchTerm);
            const levelMatch = !activeLevel || line.includes(activeLevel);
            return searchMatch && levelMatch;
        });

        logsElement.innerText = filteredLines.join('\n') || "No matching logs found.";
        logsElement.scrollTop = logsElement.scrollHeight;
    }

    function connectToLogStream(serviceName) {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        // For EFRP, the type is 'efrp' and the name can be anything, as the backend knows the service name.
        const wsUrl = `${protocol}//${window.location.host}/ws/logs/efrp/${serviceName}`;
        const ws = new WebSocket(wsUrl);
        const logsElement = document.getElementById(`logs-${serviceName}`);
        wsConnections[serviceName] = ws;

        ws.onopen = () => {
            logBuffers[serviceName] = [];
            logsElement.innerText = 'Log stream connected. Waiting for data...';
        };

        ws.onmessage = (event) => {
            const cleanedLine = cleanLogLine(event.data);
            if (!logBuffers[serviceName]) {
                logBuffers[serviceName] = [];
            }
            logBuffers[serviceName].push(cleanedLine);
            if (logBuffers[serviceName].length > MAX_LOG_LINES) {
                logBuffers[serviceName].shift();
            }
            applyFilters(serviceName);
        };

        ws.onclose = () => {
            if(wsConnections[serviceName]) {
                logsElement.innerText += '\n\n[Stream disconnected. Reconnecting...]';
                wsConnections[serviceName] = null;
                setTimeout(() => connectToLogStream(serviceName), 5000);
            }
        };

        ws.onerror = (error) => {
            console.error(`WebSocket error for ${serviceName}:`, error);
            logsElement.innerText += '\n\n[An error occurred with the log stream.]';
            if(ws) ws.close();
        };
    }

    async function loadHistory(prefix, name, since) {
        // efrp page uses 'efrp' as serviceName variable but prefix/name for api logic
        // The API route is /api/logs/:type/:name. For EFRP type=efrp, name=ignored/efrp
        const serviceName = 'efrp';
        
        if (wsConnections[serviceName]) {
            wsConnections[serviceName].close();
            wsConnections[serviceName] = null;
        }

        const logsElement = document.getElementById(`logs-${serviceName}`);
        logsElement.innerText = `Fetching logs since: ${since}...`;

        let querySince = since;
        if (since === 'boot') querySince = '1970-01-01';

        try {
            const res = await fetch(`/api/logs/efrp/efrp?since=${encodeURIComponent(querySince)}`);
            if (!res.ok) throw new Error(res.statusText);
            const text = await res.text();
            
            // Clean lines and populate buffer
            const lines = text.split('\n').filter(l => l.trim().length > 0).map(cleanLogLine);
            logBuffers[serviceName] = lines;
            applyFilters(serviceName);

        } catch (e) {
            logsElement.innerText = "Error fetching history: " + e.message;
        }
    }

    function handleLogModeChange(prefix, name, mode) {
        // For EFRP page specific logic
        const serviceName = 'efrp';
        if (mode === 'live') {
            connectToLogStream(serviceName);
        } else {
            loadHistory(prefix, name, mode);
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        connectToLogStream('efrp');
    });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.globe.min.js"></script>
    <script>
        VANTA.GLOBE({
  el: "#bg",
  mouseControls: false,
  touchControls: false,
  gyroControls: false,
  minHeight: 200.00,
  minWidth: 200.00,
  scale: 1.00,
  scaleMobile: 1.00,
  color: 0x697ca0,
  color2: 0xf21d1d,
  size: 1.20,
  backgroundColor: 0x0
})
</script>
</body>
</html>
