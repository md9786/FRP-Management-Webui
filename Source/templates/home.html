





<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRP Management Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  @keyframes spin {
    to { --angle: 360deg; }
  }

  body {
    background-color: #080808;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    color: #f1f5f9;
  }

  #bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
  }

  .content-wrapper { position: relative; z-index: 2; }

  /* Common Liquid Glass Style & Animated Border Base */
  .card, .system-info, .frp-status,
  .btn-primary, .btn-success, .btn-danger, .btn-warning, .btn-secondary {
    background: rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    border-radius: 1rem;
    position: relative;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    border: none;
    isolation: isolate;
  }

  /* Pseudo-element for border */
  .card::before, .system-info::before, .frp-status::before,
  .btn-primary::before, .btn-success::before, .btn-danger::before, .btn-warning::before, .btn-secondary::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 2px;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    z-index: -1;
    animation: spin 3s linear infinite;
    pointer-events: none;
  }

  /* Card Colors: White/Black Cycle */
  .card::before, .system-info::before, .frp-status::before {
    background: conic-gradient(from var(--angle), rgba(255,255,255,0.8), rgba(0,0,0,0.8), rgba(255,255,255,0.8));
  }

  /* Button Colors */
  .btn-primary::before { background: conic-gradient(from var(--angle), #3b82f6, transparent, #3b82f6); }
  .btn-success::before { background: conic-gradient(from var(--angle), #22c55e, transparent, #22c55e); }
  .btn-danger::before { background: conic-gradient(from var(--angle), #ef4444, transparent, #ef4444); }
  .btn-warning::before { background: conic-gradient(from var(--angle), #f59e0b, transparent, #f59e0b); }
  .btn-secondary::before { background: conic-gradient(from var(--angle), #9ca3af, transparent, #9ca3af); }

  .btn-primary, .btn-success, .btn-danger, .btn-warning, .btn-secondary {
    display: inline-block;
    text-align: center;
    font-weight: 500;
    color: white;
    transition: transform 0.2s;
  }
  .btn-primary:hover, .btn-success:hover, .btn-danger:hover, .btn-warning:hover, .btn-secondary:hover {
    transform: translateY(-2px);
  }

  /* Form/Other Elements */
  .log-pre, .form-control { 
    background-color: rgba(0, 0, 0, 0.3); 
    border: 1px solid rgba(255, 255, 255, 0.25); 
    color: #e2e8f0; 
    backdrop-filter: blur(2px);
    border-radius: 0.5rem;
  }
  .form-control:focus {
    background-color: rgba(0, 0, 0, 0.5);
    border-color: rgba(255, 255, 255, 0.6); 
    outline: none;
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
  }
  
  /* Tabs */
  .tab, .inner-tab { 
    border-bottom: 2px solid transparent;
    padding: 0.5rem 1rem; 
    cursor: pointer; 
    font-weight: 500; 
    color: #94a3b8; 
    transition: color 0.2s, border-bottom-color 0.2s; 
  }
  .tab:hover, .inner-tab:hover { color: #e2e8f0; }
  .tab.active, .inner-tab.active { 
    color: #f1f5f9; 
    border-bottom-color: #3b82f6;
  }
  .tab-content.hidden, .inner-tab-content.hidden { display: none; }
  
  .metric-value { transition: color 0.3s ease; }
  .metric-high { color: #ef4444; }
  .metric-medium { color: #f59e0b; }
  .metric-low { color: #22c55e; }
  .tab-content { max-height: 800px; overflow-y: auto; }
  .network-chart-container { width: 100%; height: 350px; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; }
  .status-dot-green { background-color: #22c55e; }
  .status-dot-orange { background-color: #f59e0b; }
  .status-dot-red { background-color: #ef4444; }
  .status-dot-gray { background-color: #6b7280; }
  .status-item { position: relative; transition: background-color 0.2s; }
  .status-item:hover { background-color: rgba(255,255,255,0.05); border-radius: 0.375rem; }
  .status-tooltip { 
    visibility: hidden; 
    position: absolute; 
    bottom: 100%; 
    left: 50%; 
    transform: translateX(-50%); 
    background: rgba(30, 41, 59, 0.95); 
    color: #e2e8f0; 
    padding: 0.25rem 0.5rem; 
    border-radius: 0.25rem; 
    font-size: 0.75rem; 
    white-space: nowrap; 
    z-index: 10; 
    backdrop-filter: blur(4px);
  }
  .status-item:hover .status-tooltip { visibility: visible; }
  
</style>
</head>
<body class="text-gray-100 min-h-screen">
  <div id="bg"></div>

  <div class="content-wrapper">
    <div class="flex">
      {{template "sidebar.html" .}}
      <main class="flex-1 p-8">
        <div class="max-w-6xl mx-auto">
          
          <!-- System Info Section -->
          <section class="system-info p-6 mb-8 shadow-lg">
            <h2 class="text-xl font-semibold text-gray-100 text-center">System Information</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mt-4">
              <div class="card p-4"><h3 class="text-sm font-medium text-gray-400 text-center">CPU Usage</h3><p class="text-2xl font-bold metric-value text-center" id="cpu-usage">--%</p></div>
              <div class="card p-4"><h3 class="text-sm font-medium text-gray-400 text-center">RAM Usage</h3><p class="text-2xl font-bold metric-value text-center" id="ram-usage">-- / --</p></div>
              <div class="card p-4"><h3 class="text-sm font-medium text-gray-400 text-center">Network Upload</h3><p class="text-2xl font-bold text-purple-300 text-center" id="network-upload">--</p></div>
              <div class="card p-4"><h3 class="text-sm font-medium text-gray-400 text-center">Network Download</h3><p class="text-2xl font-bold text-purple-300 text-center" id="network-download">--</p></div>
            </div>
          </section>
          
          <!-- FRP Status, Overview & Network History -->
          <section class="space-y-8">
            <!-- Connection Overview -->
            <div class="card p-6 shadow-lg" id="connection-overview-container">
              <h2 class="text-xl font-semibold text-gray-100 mb-4">Connection Overview</h2>
              <div class="flex border-b border-gray-600">
                <button class="tab flex-1 py-2 px-4 text-sm font-medium active" data-tab="servers">Servers</button>
                <button class="tab flex-1 py-2 px-4 text-sm font-medium" data-tab="clients">Clients</button>
              </div>
              <div class="tab-content mt-4">
                <div id="servers-tab" class="tab-pane">
                  <ul id="server-status-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                    <li class="text-gray-500 text-sm">Loading...</li>
                  </ul>
                </div>
                <div id="clients-tab" class="tab-pane hidden">
                  <ul id="client-status-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                    <li class="text-gray-500 text-sm">Loading...</li>
                  </ul>
                </div>
              </div>
            </div>

            <!-- Network History -->
            <div class="card network-chart-container p-6 shadow-lg">
              <h2 class="text-xl font-semibold text-gray-100 mb-4">Network History (Last 5 Mins)</h2>
              <canvas id="network-chart"></canvas>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

<script>
  function formatBytes(bytes, perSecond = false) {
    if (bytes < 0) bytes = 0;
    if (bytes === 0) return '0 B' + (perSecond ? '/s' : '');
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    const value = parseFloat((bytes / Math.pow(k, i)).toFixed(1));
    return `${value} ${sizes[i]}${perSecond ? '/s' : ''}`;
  }

  function updateMetricColor(element, value, thresholds) {
    element.classList.remove('metric-low', 'metric-medium', 'metric-high');
    if (value >= thresholds.high) element.classList.add('metric-high');
    else if (value >= thresholds.medium) element.classList.add('metric-medium');
    else element.classList.add('metric-low');
  }

  async function updateSystemInfo() {
    try {
      const response = await fetch('/api/system/info');
      if (!response.ok) return;
      const data = await response.json();

      const cpuEl = document.getElementById('cpu-usage');
      cpuEl.textContent = `${data.cpu_usage.toFixed(1)}%`;
      updateMetricColor(cpuEl, data.cpu_usage, { medium: 50, high: 80 });

      const ramEl = document.getElementById('ram-usage');
      const ramPercent = (data.ram_used / data.ram_total) * 100;
      ramEl.textContent = `${formatBytes(data.ram_used)} / ${formatBytes(data.ram_total)}`;
      updateMetricColor(ramEl, ramPercent, { medium: 70, high: 90 });
      
      document.getElementById('network-upload').textContent = formatBytes(data.network_upload, true);
      document.getElementById('network-download').textContent = formatBytes(data.network_download, true);
    } catch (error) {
      console.error('Error fetching system info:', error);
    }
  }

  async function updateFRPStatus() {
    try {
      const response = await fetch('/api/frp/status');
      if (!response.ok) return;
      const data = await response.json();
      document.getElementById('frp-clients').textContent = data.total_clients;
      document.getElementById('frp-proxies').textContent = data.total_proxies;
    } catch (error) {
      console.error('Error fetching FRP status:', error);
    }
  }

  async function updateConnectionOverview() {
    const serverListEl = document.getElementById('server-status-list');
    const clientListEl = document.getElementById('client-status-list');
    const overviewContainer = document.getElementById('connection-overview-container');
    
    const statusMap = {
        running: { color: 'green', text: 'Running' },
        warning: { color: 'orange', text: 'Warning' },
        error:   { color: 'red', text: 'Error' },
        stopped: { color: 'gray', text: 'Stopped' }
    };

    try {
        const response = await fetch('/api/connections/status');
        if (!response.ok) {
             overviewContainer.innerHTML = '<p class="text-gray-400 text-sm">Could not load connection status.</p>';
             return;
        }
        const data = await response.json();

        serverListEl.innerHTML = '';
        clientListEl.innerHTML = '';

        let hasActiveServers = false;
        let hasActiveClients = false;

        if (data.servers && data.servers.length > 0) {
            data.servers.forEach(server => {
                const statusInfo = statusMap[server.status] || statusMap['stopped'];
                const link = document.createElement('a');
                link.href = `/manage-frp#servers:${server.name}`;
                link.className = "block w-full";
                link.innerHTML = `
                    <div class="status-item text-sm p-1 rounded">
                        <div class="flex items-center">
                            <span class="status-dot status-dot-${statusInfo.color} mb-1"></span>
                            <span class="text-gray-300 truncate pl-2">${server.name}</span>
                            <span class="status-tooltip capitalize">${statusInfo.text}</span>
                        </div>
                    </div>
                `;
                const li = document.createElement('li');
                li.appendChild(link);
                serverListEl.appendChild(li);

                if (server.status === 'running' || server.status === 'warning') {
                    hasActiveServers = true;
                }
            });
        } else {
            serverListEl.innerHTML = '<li class="text-gray-500 text-sm col-span-3">No servers configured.</li>';
        }

        if (data.clients && data.clients.length > 0) {
            data.clients.forEach(client => {
                const statusInfo = statusMap[client.status] || statusMap['stopped'];
                const link = document.createElement('a');
                link.href = `/manage-frp#clients:${client.name}`;
                link.className = "block w-full";
                link.innerHTML = `
                    <div class="status-item text-sm p-1 rounded">
                        <div class="flex items-center">
                            <span class="status-dot status-dot-${statusInfo.color} mb-1"></span>
                            <span class="text-gray-300 truncate pl-2">${client.name}</span>
                            <span class="status-tooltip capitalize">${statusInfo.text}</span>
                        </div>
                    </div>
                `;
                const li = document.createElement('li');
                li.appendChild(link);
                clientListEl.appendChild(li);

                if (client.status === 'running' || client.status === 'warning') {
                    hasActiveClients = true;
                }
            });
        } else {
            clientListEl.innerHTML = '<li class="text-gray-500 text-sm col-span-3">No clients configured.</li>';
        }

        // Only auto-switch tabs on initial load or if user hasn't interacted? 
        // For now we stick to original logic: prioritise servers if active, else clients.
        // But we add a check to not disrupt if user is clicking.
        if (!window.tabUserSelected) {
             const tabButtons = document.querySelectorAll('.tab');
             const tabPanes = document.querySelectorAll('.tab-pane');
             tabButtons.forEach(btn => btn.classList.remove('active'));
             tabPanes.forEach(pane => pane.classList.add('hidden'));

             if (hasActiveServers) {
                 document.querySelector('.tab[data-tab="servers"]').classList.add('active');
                 document.getElementById('servers-tab').classList.remove('hidden');
             } else if (hasActiveClients) {
                 document.querySelector('.tab[data-tab="clients"]').classList.add('active');
                 document.getElementById('clients-tab').classList.remove('hidden');
             } else {
                 document.querySelector('.tab[data-tab="servers"]').classList.add('active');
                 document.getElementById('servers-tab').classList.remove('hidden');
             }
        }

    } catch (error) {
        console.error('Error fetching connection overview:', error);
        serverListEl.innerHTML = '<li class="text-red-400 text-sm col-span-3">Error loading status.</li>';
        clientListEl.innerHTML = '<li class="text-red-400 text-sm col-span-3">Error loading status.</li>';
    }
}

  let networkChart;
  async function updateNetworkChart() {
    try {
      const response = await fetch('/api/system/history');
      if (!response.ok) return;
      const data = await response.json() || [];

      const labels = data.map(p => new Date(p.timestamp).toLocaleTimeString());
      const uploadData = data.map(p => p.network_upload / 1024); // KB/s
      const downloadData = data.map(p => p.network_download / 1024); // KB/s

      if (!networkChart) {
        const ctx = document.getElementById('network-chart').getContext('2d');
        
        // Create Gradients
        const uploadGradient = ctx.createLinearGradient(0, 0, 0, 300);
        uploadGradient.addColorStop(0, 'rgba(192, 132, 252, 0.5)');
        uploadGradient.addColorStop(1, 'rgba(192, 132, 252, 0.0)');

        const downloadGradient = ctx.createLinearGradient(0, 0, 0, 300);
        downloadGradient.addColorStop(0, 'rgba(74, 222, 128, 0.5)');
        downloadGradient.addColorStop(1, 'rgba(74, 222, 128, 0.0)');

        networkChart = new Chart(ctx, {
          type: 'line',
          data: { labels, datasets: [
            { 
              label: 'Upload (KB/s)', 
              data: uploadData, 
              borderColor: 'rgba(192, 132, 252, 1)', 
              backgroundColor: uploadGradient, 
              fill: true, 
              tension: 0.4,
              pointRadius: 0,
              pointHoverRadius: 4
            },
            { 
              label: 'Download (KB/s)', 
              data: downloadData, 
              borderColor: 'rgba(74, 222, 128, 1)', 
              backgroundColor: downloadGradient, 
              fill: true, 
              tension: 0.4,
              pointRadius: 0,
              pointHoverRadius: 4
            }
          ]},
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { 
                beginAtZero: true, 
                ticks: { color: '#94a3b8' }, 
                grid: { color: 'rgba(255, 255, 255, 0.1)' } 
              },
              x: { 
                ticks: { color: '#94a3b8', maxTicksLimit: 8 }, 
                grid: { color: 'rgba(255, 255, 255, 0.1)' } 
              }
            },
            plugins: { 
              legend: { labels: { color: '#e2e8f0' } },
              tooltip: {
                mode: 'index',
                intersect: false,
                backgroundColor: 'rgba(0,0,0,0.8)',
                titleColor: '#fff',
                bodyColor: '#fff'
              }
            },
            interaction: {
              mode: 'nearest',
              axis: 'x',
              intersect: false
            }
          }
        });
      } else {
        networkChart.data.labels = labels;
        networkChart.data.datasets[0].data = uploadData;
        networkChart.data.datasets[1].data = downloadData;
        networkChart.update();
      }
    } catch (error) {
      console.error('Error fetching network history:', error);
    }
  }
  
  document.addEventListener('DOMContentLoaded', () => {
    updateSystemInfo();
    updateFRPStatus();
    updateNetworkChart();
    updateConnectionOverview();
    setInterval(updateSystemInfo, 2000);
    setInterval(updateFRPStatus, 5000);
    setInterval(updateNetworkChart, 5000);
    setInterval(updateConnectionOverview, 1000);

    // Tab switching logic
    window.tabUserSelected = false;
    const tabButtons = document.querySelectorAll('.tab');
    const tabPanes = document.querySelectorAll('.tab-pane');

    tabButtons.forEach(button => {
      button.addEventListener('click', () => {
        window.tabUserSelected = true;
        tabButtons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');

        tabPanes.forEach(pane => pane.classList.add('hidden'));
        document.getElementById(`${button.dataset.tab}-tab`).classList.remove('hidden');
      });
    });
  });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.globe.min.js"></script>
    <script>
        VANTA.GLOBE({
  el: "#bg",
  mouseControls: false,
  touchControls: false,
  gyroControls: false,
  minHeight: 200.00,
  minWidth: 200.00,
  scale: 1.00,
  scaleMobile: 1.00,
  color: 0x697ca0,
  color2: 0xf21d1d,
  size: 1.20,
  backgroundColor: 0x0
})
</script>
</body>
</html>
