<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRP Management - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  @keyframes spin {
    to { --angle: 360deg; }
  }

  body {
    background-color: #080808;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    color: #f1f5f9;
  }

  #bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
  }

  /* Liquid Glass + Border Animation Base */
  .login-card, .btn-primary {
    background: rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    border-radius: 1rem;
    position: relative;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    border: none;
    isolation: isolate;
  }

  /* Animated Border Pseudo-element */
  .login-card::before, .btn-primary::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 2px;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    z-index: -1;
    animation: spin 3s linear infinite;
    pointer-events: none;
  }

  /* Card Colors */
  .login-card::before {
    background: conic-gradient(from var(--angle), rgba(255,255,255,0.8), rgba(0,0,0,0.8), rgba(255,255,255,0.8));
  }

  /* Button Colors */
  .btn-primary::before {
    background: conic-gradient(from var(--angle), #3b82f6, transparent, #3b82f6);
  }

  .btn-primary {
    color: white;
    font-weight: 600;
    transition: transform 0.2s;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
  }

  /* Form Elements - More Defined Borders */
  .form-control {
    width: 100%;
    padding: 0.75rem 1rem;
    color: #e2e8f0; 
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(0, 0, 0, 0.3);
    border-radius: 0.5rem;
    backdrop-filter: blur(2px);
    transition: all 0.3s ease;
  }

  .form-control:focus {
    outline: none;
    border-color: rgba(59, 130, 246, 0.6);
    background: rgba(0, 0, 0, 0.5);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
  }
  .form-control::placeholder {
    color: #64748b;
  }

  /* Alerts */
  .alert {
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(2px);
    border-radius: 0.5rem;
    position: relative;
    border: 1px solid rgba(255,255,255,0.25);
  }
  .error-alert { border-color: rgba(220, 38, 38, 0.5); color: #fca5a5; }
  .success-alert { border-color: rgba(22, 163, 74, 0.5); color: #86efac; }

  .content-wrapper { position: relative; z-index: 2; }

</style>

</head>
<body class="text-gray-100 min-h-screen flex items-center justify-center">
  <div id="bg"></div>

  <!-- Login Container -->
  <div class="content-wrapper w-full max-w-md px-6">
    <div class="login-card p-8">
      <!-- Header -->
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-white mb-2" style="text-shadow: 0 2px 4px rgba(0,0,0,0.3);">FRP Management</h1>
        <p class="text-gray-400">Sign in to access your dashboard</p>
      </div>
      
      <!-- Success Alert -->
      {{ if .Message }}
      <div class="alert success-alert p-3 mb-6 text-sm">
        <div class="flex items-center">
          <svg class="w-4 h-4 mr-2 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
          </svg>
          {{ .Message }}
        </div>
      </div>
      {{ end }}

      <!-- Error Alert -->
      {{ if .Error }}
      <div class="alert error-alert p-3 mb-6 text-sm">
        <div class="flex items-center">
          <svg class="w-4 h-4 mr-2 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
          </svg>
          {{ .Error }}
        </div>
      </div>
      {{ end }}

      <!-- Login Form -->
      <form method="post" class="space-y-6">
        <div>
          <label for="username" class="block text-sm font-medium text-gray-300 mb-2">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="form-control"
            placeholder="Enter your username"
            required
            autofocus
          >
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-300 mb-2">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control"
            placeholder="Enter your password"
            required
          >
        </div>

        <button 
          type="submit" 
          class="btn-primary w-full px-4 py-3 text-lg"
        >
          Sign In
        </button>
      </form>

      <!-- Footer -->
      <div class="text-center mt-8 pt-6 border-t border-gray-700/50">
        <p class="text-xs text-gray-500">
          Secure access to FRP Management System
        </p>
      </div>
    </div>
  </div>

  <script>
    // Form submission loading state
    const form = document.querySelector('form');
    const submitBtn = document.querySelector('button[type="submit"]');
    
    if(form && submitBtn) {
        form.addEventListener('submit', function() {
          submitBtn.innerText = 'Signing In...';
          submitBtn.style.opacity = '0.8';
          submitBtn.disabled = true;
        });
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && e.ctrlKey) {
        const f = document.querySelector('form');
        if(f) f.submit();
      }
    });
  </script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.globe.min.js"></script>
    <script>
        VANTA.GLOBE({
  el: "#bg",
  mouseControls: false,
  touchControls: false,
  gyroControls: false,
  minHeight: 200.00,
  minWidth: 200.00,
  scale: 1.00,
  scaleMobile: 1.00,
  color: 0x697ca0,
  color2: 0xf21d1d,
  size: 1.20,
  backgroundColor: 0x0
})
</script>
</body>
</html>
