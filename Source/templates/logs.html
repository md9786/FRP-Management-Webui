<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Logs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }
    @keyframes spin {
      to { --angle: 360deg; }
    }

    body {
        background-color: #080808;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        color: #f1f5f9;
    }
    
    #bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .content-wrapper { position: relative; z-index: 2; }

    /* Button Liquid Glass */
    .btn-secondary {
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      border-radius: 1rem;
      position: relative;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      border: none;
      isolation: isolate;
      display: inline-block;
      text-align: center;
      font-weight: 500;
      color: white;
      transition: transform 0.2s;
    }
    
    .btn-secondary::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 2px;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      z-index: -1;
      animation: spin 3s linear infinite;
      pointer-events: none;
      background: conic-gradient(from var(--angle), #9ca3af, transparent, #9ca3af);
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
    }

    .log-pre { 
      background: rgba(0, 0, 0, 0.3); 
      border: 1px solid rgba(255, 255, 255, 0.25); 
      color: #e5e7eb; 
      backdrop-filter: blur(2px);
      white-space: pre-wrap; 
      word-break: break-word; 
      border-radius: 0.5rem;
    }
  </style>
</head>
<body class="text-gray-100 min-h-screen">
  <div id="bg"></div>
  <div class="content-wrapper">
    <div class="container max-w-4xl mx-auto p-8">
      <h1 class="text-2xl font-semibold text-gray-100 mb-6">Logs</h1>
      <pre class="log-pre p-4 mt-2 text-sm">{{ .Log }}</pre>
      <a href="{{ .Back }}" class="btn-secondary mt-6 px-4 py-2 text-gray-200 text-center">Back</a>
    </div>
  </div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.globe.min.js"></script>
    <script>
        VANTA.GLOBE({
  el: "#bg",
  mouseControls: false,
  touchControls: false,
  gyroControls: false,
  minHeight: 200.00,
  minWidth: 200.00,
  scale: 1.00,
  scaleMobile: 1.00,
  color: 0x697ca0,
  color2: 0xf21d1d,
  size: 1.20,
  backgroundColor: 0x0
})
</script>
</body>
</html>
