<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
<style>
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  @keyframes spin {
    to { --angle: 360deg; }
  }

  body {
    background-color: #080808;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    color: #f1f5f9;
  }

  #bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
  }

  .content-wrapper { position: relative; z-index: 2; }

  /* Common Liquid Glass Style & Animated Border Base */
  .card, .btn-primary, .btn-success, .btn-danger, .btn-warning, .btn-secondary {
    background: rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    border-radius: 1rem;
    position: relative;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    border: none;
    isolation: isolate;
  }

  /* Pseudo-element for border */
  .card::before, 
  .btn-primary::before, .btn-success::before, .btn-danger::before, .btn-warning::before, .btn-secondary::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 2px;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    z-index: -1;
    animation: spin 3s linear infinite;
    pointer-events: none;
  }

  /* Card Colors: White/Black Cycle */
  .card::before {
    background: conic-gradient(from var(--angle), rgba(255,255,255,0.8), rgba(0,0,0,0.8), rgba(255,255,255,0.8));
  }

  /* Button Colors */
  .btn-primary::before { background: conic-gradient(from var(--angle), #3b82f6, transparent, #3b82f6); }
  .btn-success::before { background: conic-gradient(from var(--angle), #22c55e, transparent, #22c55e); }
  .btn-danger::before { background: conic-gradient(from var(--angle), #ef4444, transparent, #ef4444); }
  .btn-warning::before { background: conic-gradient(from var(--angle), #f59e0b, transparent, #f59e0b); }
  .btn-secondary::before { background: conic-gradient(from var(--angle), #9ca3af, transparent, #9ca3af); }

  .btn-primary, .btn-success, .btn-danger, .btn-warning, .btn-secondary {
    display: inline-block;
    text-align: center;
    font-weight: 500;
    color: white;
    transition: transform 0.2s;
  }
  .btn-primary:hover, .btn-success:hover, .btn-danger:hover, .btn-warning:hover, .btn-secondary:hover {
    transform: translateY(-2px);
  }

  .error-alert {
    background: rgba(220, 38, 38, 0.2);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(248, 113, 113, 0.3);
    color: #fff;
  }

  /* Form Inputs - More Defined Borders */
  .form-control {
    background-color: rgba(0, 0, 0, 0.3); 
    border: 1px solid rgba(255, 255, 255, 0.25); 
    color: #e2e8f0; 
    backdrop-filter: blur(4px);
    transition: border-color 0.2s ease;
    border-radius: 0.5rem;
  }
  .form-control:focus {
    background-color: rgba(0, 0, 0, 0.5);
    border-color: rgba(255, 255, 255, 0.6); 
    outline: none;
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
  }
  .form-label { color: #94a3b8; }
</style>

</head>
<body class="text-gray-100 min-h-screen">
  <div id="bg"></div>

  <div class="content-wrapper">
    <div class="flex">
        {{template "sidebar.html" .}}
        <main class="flex-1 p-8">
            <div class="max-w-xl mx-auto">
                <h1 class="text-2xl font-semibold text-gray-100 mb-6">Settings</h1>

                {{ if .Error }}
                <div class="error-alert rounded-lg p-3 mb-6 text-sm text-white">
                  <div class="flex items-center">
                    <svg class="w-4 h-4 mr-2 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                    </svg>
                    {{ .Error }}
                  </div>
                </div>
                {{ end }}

                <form id="settings-form" method="post" action="/settings" class="card p-6 shadow-lg space-y-6">
                    <div>
                        <label for="new_username" class="form-label block text-sm font-medium mb-2">Username</label>
                        <input type="text" id="new_username" name="new_username" value="{{ .Username }}" required class="form-control w-full p-3 text-sm" />
                    </div>
                    <div>
                        <label for="current_password" class="form-label block text-sm font-medium mb-2">Current Password (Required to make changes)</label>
                        <input type="password" id="current_password" name="current_password" required class="form-control w-full p-3 text-sm" placeholder="Enter your current password" />
                    </div>
                    <hr class="border-gray-600">
                    <div>
                        <label for="new_password" class="form-label block text-sm font-medium mb-2">New Password</label>
                        <input type="password" id="new_password" name="new_password" class="form-control w-full p-3 text-sm" placeholder="Leave blank to keep current password" />
                    </div>
                    <div>
                        <label for="confirm_password" class="form-label block text-sm font-medium mb-2">Confirm New Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control w-full p-3 text-sm" placeholder="Confirm new password" />
                    </div>
                    <div class="flex space-x-4 pt-4">
                        <button type="submit" class="btn-primary px-4 py-2 text-white font-medium">Save Changes</button>
                        <a href="/" class="btn-secondary px-4 py-2 text-gray-200 text-center">Back</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
  </div>
  <script>
    document.getElementById('settings-form').addEventListener('submit', function(e) {
        const newPassword = document.getElementById('new_password').value;
        const confirmPassword = document.getElementById('confirm_password').value;

        if (newPassword !== confirmPassword) {
            alert('New passwords do not match.');
            e.preventDefault();
        }
    });
  </script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.globe.min.js"></script>
    <script>
        VANTA.GLOBE({
  el: "#bg",
  mouseControls: false,
  touchControls: false,
  gyroControls: false,
  minHeight: 200.00,
  minWidth: 200.00,
  scale: 1.00,
  scaleMobile: 1.00,
  color: 0x697ca0,
  color2: 0xf21d1d,
  size: 1.20,
  backgroundColor: 0x0
})
</script>
</body>
</html>
