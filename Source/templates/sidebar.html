<style>
  .sidebar {
    background: rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid rgba(255, 255, 255, 0.1);
    color: #f1f5f9;
    transition: transform 0.3s ease-in-out;
  }

  .sidebar-link {
    transition: all 0.2s ease;
    background: transparent;
    border: 1px solid transparent;
    color: #94a3b8;
    padding: 0.75rem 1rem;
    display: block;
    border-radius: 0.375rem;
  }

  .sidebar-link:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.1);
    transform: translateX(4px);
    color: #ffffff;
    backdrop-filter: blur(8px);
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
  }

  .sidebar-link:active {
    background: rgba(255, 255, 255, 0.15);
  }

  /* Hide sidebar by default on mobile */
  @media (max-width: 768px) {
    .sidebar {
      transform: translateX(-100%);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 50;
      width: 75%;
      max-width: 16rem;
      background: rgba(0, 0, 0, 0.5); /* More opaque on mobile for readability */
      backdrop-filter: blur(10px);
    }
    .sidebar.open {
      transform: translateX(0);
    }
  }
</style>

<div class="relative">
  <!-- Hamburger Button for Mobile -->
  <button id="toggleSidebar" class="md:hidden fixed top-4 left-4 z-50 p-2 bg-gray-800 text-white rounded-md focus:outline-none bg-opacity-80 backdrop-blur-md border border-white/10">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path id="hamburgerIcon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
  </button>

  <!-- Sidebar -->
  <div class="w-64 sidebar min-h-screen p-4 md:translate-x-0">
    <h1 class="text-2xl font-bold text-gray-100 mb-6 pl-2" style="text-shadow: 0 0 10px rgba(255,255,255,0.2);">FRP Manager 🚀</h1>
    <nav class="space-y-2">
      <a href="/" class="sidebar-link">Dashboard</a>
      <a href="/setup-frp" class="sidebar-link">Setup & Presets</a>
      <a href="/manage-frp" class="sidebar-link">Manage FRP</a>
      <a href="/efrp" class="sidebar-link">Manage EFRP</a>
      <a href="/status" class="sidebar-link">Show Status</a>
      <a href="/settings" class="sidebar-link">Settings</a>
      <a href="/logout" class="sidebar-link">Logout</a>
    </nav>
  </div>
</div>

<script>
  const toggleButton = document.getElementById('toggleSidebar');
  const sidebar = document.querySelector('.sidebar');
  const hamburgerIcon = document.getElementById('hamburgerIcon');

  toggleButton.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    
    // Toggle between hamburger and close icon
    if (sidebar.classList.contains('open')) {
      hamburgerIcon.setAttribute('d', 'M6 18L18 6M6 6l12 12');
    } else {
      hamburgerIcon.setAttribute('d', 'M4 6h16M4 12h16M4 18h16');
    }
  });
</script>
