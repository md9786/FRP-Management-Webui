<style>
  /* Ensure animation is consistent if not defined in parent, though it should be */
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  @keyframes spin {
    to { --angle: 360deg; }
  }

  .sidebar {
    background: rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    color: #f1f5f9;
    transition: transform 0.3s ease-in-out;
    position: relative;
    border-right: 1px solid rgba(255, 255, 255, 0.1);
  }

  .sidebar-link {
    position: relative;
    isolation: isolate;
    transition: all 0.2s ease;
    background: rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(2px);
    color: #94a3b8;
    padding: 0.75rem 1rem;
    display: block;
    border-radius: 0.5rem;
    margin-bottom: 0.5rem;
    border: 1px solid transparent; /* Placeholder to prevent layout shift */
  }

  /* Animated Border for Sidebar Links */
  .sidebar-link::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 2px;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    z-index: -1;
    animation: spin 3s linear infinite;
    pointer-events: none;
    /* White/Black Cycle for links */
    background: conic-gradient(from var(--angle), rgba(255,255,255,0.8), rgba(0,0,0,0.8), rgba(255,255,255,0.8));
    opacity: 0; /* Hidden by default, shown on hover/active */
    transition: opacity 0.3s ease;
  }

  .sidebar-link:hover::before,
  .sidebar-link.active::before {
    opacity: 1;
  }

  .sidebar-link:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
    transform: translateX(4px);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
  }

  .sidebar-link.active {
    background: rgba(255, 255, 255, 0.15);
    color: #ffffff;
    font-weight: 600;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
  }

  .sidebar-link:active {
    background: rgba(255, 255, 255, 0.2);
  }

  /* Mobile Toggle Button Styling */
  #toggleSidebar {
    background: rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    border-radius: 0.5rem;
    position: fixed;
    border: none;
    isolation: isolate;
    color: white;
  }

  #toggleSidebar::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 2px;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    z-index: -1;
    animation: spin 3s linear infinite;
    pointer-events: none;
    background: conic-gradient(from var(--angle), #9ca3af, transparent, #9ca3af);
  }

  /* Hide sidebar by default on mobile */
  @media (max-width: 768px) {
    .sidebar {
      transform: translateX(-100%);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 50;
      width: 75%;
      max-width: 16rem;
      background: rgba(0, 0, 0, 0.85); 
    }
    .sidebar.open {
      transform: translateX(0);
    }
  }
</style>

<div class="relative">
  <!-- Hamburger Button for Mobile -->
  <button id="toggleSidebar" class="md:hidden top-4 left-4 z-50 p-2 focus:outline-none">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path id="hamburgerIcon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
  </button>

  <!-- Sidebar -->
  <div class="w-64 sidebar min-h-screen p-4 md:translate-x-0">
    <h1 class="text-2xl font-bold text-gray-100 mb-6 pl-2" style="text-shadow: 0 0 10px rgba(255,255,255,0.2);">FRP Manager 🚀</h1>
    <nav class="space-y-2">
      <a href="/" class="sidebar-link">Dashboard</a>
      <a href="/setup-frp" class="sidebar-link">Setup & Presets</a>
      <a href="/manage-frp" class="sidebar-link">Manage FRP</a>
      <a href="/efrp" class="sidebar-link">Manage EFRP</a>
      <a href="/status" class="sidebar-link">Show Status</a>
      <a href="/settings" class="sidebar-link">Settings</a>
      <a href="/logout" class="sidebar-link">Logout</a>
    </nav>
  </div>
</div>

<script>
  const toggleButton = document.getElementById('toggleSidebar');
  const sidebar = document.querySelector('.sidebar');
  const hamburgerIcon = document.getElementById('hamburgerIcon');

  toggleButton.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    
    // Toggle between hamburger and close icon
    if (sidebar.classList.contains('open')) {
      hamburgerIcon.setAttribute('d', 'M6 18L18 6M6 6l12 12');
    } else {
      hamburgerIcon.setAttribute('d', 'M4 6h16M4 12h16M4 18h16');
    }
  });

  // Highlight active link based on current URL
  document.addEventListener('DOMContentLoaded', () => {
    const currentPath = window.location.pathname;
    const links = document.querySelectorAll('.sidebar-link');
    
    links.forEach(link => {
      const href = link.getAttribute('href');
      // Exact match or handles trailing slashes logic if needed
      if (href === currentPath || (currentPath === '' && href === '/') || (href !== '/' && currentPath.startsWith(href))) {
        link.classList.add('active');
      }
    });
  });
</script>
