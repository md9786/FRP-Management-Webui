<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRP Status</title>
  <script src="https://cdn.tailwindcss.com"></script>
<style>
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  @keyframes spin {
    to { --angle: 360deg; }
  }

  body {
    background-color: #080808;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    color: #f1f5f9;
  }

  #bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
  }

  .content-wrapper { position: relative; z-index: 2; }

  /* Common Liquid Glass Style & Animated Border Base */
  .card, .btn-primary, .btn-success, .btn-danger, .btn-warning, .btn-secondary {
    background: rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    border-radius: 1rem;
    position: relative;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    border: none;
    isolation: isolate;
  }

  /* Pseudo-element for border */
  .card::before, 
  .btn-primary::before, .btn-success::before, .btn-danger::before, .btn-warning::before, .btn-secondary::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 2px;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    z-index: -1;
    animation: spin 3s linear infinite;
    pointer-events: none;
  }

  /* Card Colors: White/Black Cycle */
  .card::before {
    background: conic-gradient(from var(--angle), rgba(255,255,255,0.8), rgba(0,0,0,0.8), rgba(255,255,255,0.8));
  }

  /* Button Colors */
  .btn-primary::before { background: conic-gradient(from var(--angle), #3b82f6, transparent, #3b82f6); }
  .btn-success::before { background: conic-gradient(from var(--angle), #22c55e, transparent, #22c55e); }
  .btn-danger::before { background: conic-gradient(from var(--angle), #ef4444, transparent, #ef4444); }
  .btn-warning::before { background: conic-gradient(from var(--angle), #f59e0b, transparent, #f59e0b); }
  .btn-secondary::before { background: conic-gradient(from var(--angle), #9ca3af, transparent, #9ca3af); }

  .btn-primary, .btn-success, .btn-danger, .btn-warning, .btn-secondary {
    display: inline-block;
    text-align: center;
    font-weight: 500;
    color: white;
    transition: transform 0.2s;
  }
  .btn-primary:hover, .btn-success:hover, .btn-danger:hover, .btn-warning:hover, .btn-secondary:hover {
    transform: translateY(-2px);
  }

  .log-pre {
    background: rgba(0, 0, 0, 0.3); 
    border: 1px solid rgba(255, 255, 255, 0.25); 
    color: #e2e8f0; 
    backdrop-filter: blur(4px);
    white-space: pre-wrap;
    word-break: break-word;
    border-radius: 0.5rem;
  }
</style>

</head>
<body class="text-gray-100 min-h-screen">
  <div id="bg"></div>
  <div class="content-wrapper">
    <div class="flex">
      <!-- Sidebar -->
      {{template "sidebar.html" .}}
      <div class="flex-1 p-8">
        <!-- Main Content -->
        <div class="max-w-4xl mx-auto">
          <h1 class="text-2xl font-semibold text-gray-100 mb-4">FRP & EFRP Services Status</h1>
          <div class="card p-6 mb-4 shadow-lg">

            <h5 class="text-lg font-semibold text-gray-100 mb-3">Version</h5>
            <pre id="version" class="log-pre p-4 mb-6 text-sm">{{ .Version }}</pre>

            <h5 class="text-lg font-semibold text-gray-100 mb-3">Running FRP/EFRP Services</h5>
            <pre id="running" class="log-pre p-4 mb-6 text-sm">{{ .Running }}</pre>

            <h5 class="text-lg font-semibold text-gray-100 mb-3">Enabled FRP/EFRP Services</h5>
            <pre id="enabled" class="log-pre p-4 mb-6 text-sm">{{ .Enabled }}</pre>

            <a href="/" class="btn-secondary px-4 py-2 text-gray-200 text-center inline-block">Back</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Filter lines that contain "frp" or "efrp" (case-insensitive)
    function filterFrpLines(text) {
      if (!text || text.trim() === "") return "No FRP/EFRP services found";
      const lines = text.split('\n');
      const filtered = lines.filter(line => 
        line.toLowerCase().includes('frp') || line.toLowerCase().includes('efrp')
      );
      return filtered.length > 0 ? filtered.join('\n') : "No FRP/EFRP services found";
    }

    function processLogs(elementId) {
      const element = document.getElementById(elementId);
      if (!element) return;

      let logs = element.innerText.trim();

      // Filter only FRP/EFRP related lines for running and enabled sections
      if (elementId === 'running' || elementId === 'enabled') {
        logs = filterFrpLines(logs);
      }

      // Basic cleanup (remove hostname if present)
      const finalLogs = logs.replace(/dashingorder\.aeza\.network/g, '');
      element.innerText = finalLogs || "No data available";
    }

    window.onload = () => {
      ['version', 'running', 'enabled'].forEach(id => {
        processLogs(id);
      });
    };
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.globe.min.js"></script>
  <script>
    VANTA.GLOBE({
      el: "#bg",
      mouseControls: false,
      touchControls: false,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color: 0x697ca0,
      color2: 0xf21d1d,
      size: 1.20,
      backgroundColor: 0x0
    })
  </script>
</body>
</html>
